<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-LECTION 2024</title>
<style>
*{box-sizing:border-box;margin:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#FFFDF5;color:#1a1a1a;min-height:100vh;padding:0}
.tricolor{height:10px;background:linear-gradient(90deg,#FF9933 33%,#fff 33% 66%,#138808 66%)}
.wrap{max-width:900px;margin:auto;padding:24px}
h1{text-align:center;font-size:2.2rem;color:#0b3d91}
.sub{text-align:center;color:#666;margin:4px 0 20px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;border:2px solid #eee;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card.saffron{border-top:6px solid #FF9933}.card.white{border-top:6px solid #0b3d91}.card.green{border-top:6px solid #138808}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{font-size:.8rem;color:#666}
input,select{background:#fff;border:2px solid #ddd;color:#1a1a1a;border-radius:8px;padding:10px;min-width:150px}
button{background:linear-gradient(135deg,#FF9933,#e07b00);border:0;color:#fff;font-weight:700;font-size:1rem;padding:12px;border-radius:12px;width:100%;cursor:pointer;margin-top:10px}
button:hover{opacity:.9}
button.ghost{background:#fff;border:2px solid #ddd;color:#333}
button.danger{background:linear-gradient(135deg,#d32f2f,#b71c1c)}
button.ok{background:linear-gradient(135deg,#138808,#0b5e05)}
.steps{display:flex;gap:8px;margin:16px 0}
.step{flex:1;text-align:center;padding:10px;border-radius:10px;background:#fff;border:2px solid #ddd;color:#999;font-size:.85rem}
.step.on{border-color:#138808;color:#0b5e05;background:#e8f5e9;font-weight:700}
.winners{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.win{background:linear-gradient(135deg,#FF9933,#e07b00);border-radius:14px;padding:16px;text-align:center;color:#fff}
.run{background:#fff;border:2px solid #138808;border-radius:14px;padding:16px;text-align:center;color:#0b5e05}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee}
th{background:#FFF3E0}
.barrow{display:grid;grid-template-columns:60px 1fr 90px;gap:8px;align-items:center;margin:8px 0;font-size:.9rem}
.track{background:#f0f0f0;border-radius:99px;height:22px;overflow:hidden}
.fill2{height:100%;border-radius:99px}
.msg{padding:10px;border-radius:8px;margin-top:10px;text-align:center;color:#fff}
.ok2{background:#138808}.err{background:#b71c1c}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700;color:#fff}
.lock{color:#888;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="tricolor"></div>
<div class="wrap">
<h1>🇮🇳 E-LECTION 2024 🇮🇳</h1>
<p class="sub">Nomination → Voting → Results</p>
<div class="steps"><div class="step" id="s1">1️⃣ Nomination</div><div class="step" id="s2">2️⃣ Voting</div><div class="step" id="s3">3️⃣ Results</div></div>
<div class="card white" id="adminCard">
<div class="row"><div style="flex:1"><label>Election status: <span id="phase" class="pill"></span></label></div></div>
<button id="openVote" class="ok">▶ Start Voting (close nominations)</button>
<button id="endBtn" class="danger">⏹ End Election & Declare Results</button>
<button id="reset" class="ghost">↺ New Election (reset all)</button>
</div>
<div class="card" id="pNom">
<h3>➕ Step 1 — Nominate Candidates</h3><br>
<div class="row"><div><label>Candidate name</label><br><input id="newName" placeholder="e.g. XYZ"></div></div>
<button id="add">Nominate</button><div id="nmsg"></div>
<div id="nomList" style="margin-top:12px"></div>
</div>
<div class="card" id="pVote">
<h3>🗳️ Step 2 — Voters Vote</h3><br>
<div id="voteForm">
<div class="row"><div><label>Voter ID (1 vote each)</label><br><input id="vid" placeholder="e.g. VOTER-001"></div>
<div><label>Candidate</label><br><select id="voteFor"></select></div></div>
<button id="cast">Cast My Vote</button><div id="vmsg"></div>
</div>
<div id="voteLock" class="lock" hidden></div>
</div>
<div id="out"></div>
</div>
<script>
// ponytail: browser-local demo — phase+votes in localStorage, no server/auth; add backend + OTP for real elections
let S=JSON.parse(localStorage.getItem('el3')||'{"phase":"nominate","colors":{},"counts":{},"voted":[]}');
const save=()=>localStorage.setItem('el3',JSON.stringify(S));
const names=()=>Object.keys(S.colors);
const total=()=>Object.values(S.counts).reduce((a,b)=>a+b,0);
function ui(){
  const p=S.phase;
  document.getElementById('phase').textContent=p.toUpperCase();
  document.getElementById('phase').style.background=p==='nominate'?'#854d0e':p==='voting'?'#138808':'#0b3d91';
  ['s1','s2','s3'].forEach((id,i)=>document.getElementById(id).className='step'+((i===0&&p==='nominate')||(i===1&&p==='voting')||(i===2&&p==='ended')?' on':''));
  document.getElementById('openVote').style.display=p==='nominate'?'':'none';
  document.getElementById('endBtn').style.display=p==='voting'?'':'none';
  document.getElementById('reset').style.display=p==='voting'?'none':'';
  document.getElementById('pNom').style.display=p==='nominate'?'':'none';
  const lock=document.getElementById('voteLock'),form=document.getElementById('voteForm');
  if(p==='nominate'){form.style.display='none';lock.hidden=false;lock.textContent='🔒 Voting not started — nominations are open.';}
  else if(p==='voting'){form.style.display='';lock.hidden=true;}
  else{form.style.display='none';lock.hidden=false;lock.textContent='🔒 Voting closed — results declared below.';}
  document.getElementById('nomList').innerHTML=names().length?'<br><b>Nominees:</b> '+names().map(c=>`<span class="pill" style="background:#fff;border:2px solid ${S.colors[c]};color:#333"><span style="color:${S.colors[c]}">●</span> ${c}</span>`).join(' '):'<p class="sub">No candidates yet.</p>';
  document.getElementById('voteFor').innerHTML=names().map(c=>`<option>${c}</option>`).join('');
  render();
}
function render(){
  const out=document.getElementById('out');
  if(S.phase!=='ended'||!total()){out.innerHTML=S.phase==='ended'?'<p class="sub">Election ended with zero votes.</p>':'';return;}
  const t=total(),ranked=[...names()].sort((a,b)=>S.counts[b]-S.counts[a]),max=S.counts[ranked[0]];
  out.innerHTML=`<div class="winners">
    <div class="win"><div>🏆 WINNER</div><h2>${ranked[0]}</h2><b>${S.counts[ranked[0]].toLocaleString()} (${(S.counts[ranked[0]]/t*100).toFixed(1)}%)</b></div>
    <div class="run"><div>🥈 RUNNER-UP</div><h2>${ranked[1]||'—'}</h2><b>${ranked[1]?S.counts[ranked[1]].toLocaleString()+' ('+(S.counts[ranked[1]]/t*100).toFixed(1)+'%)':''}</b></div></div>
  <div class="card"><h3>📊 Final Results — ${t.toLocaleString()} votes</h3><br>
  <table><tr><th>#</th><th>Candidate</th><th>Votes</th><th>Share</th></tr>
  ${ranked.map((c,i)=>`<tr><td>#${i+1}</td><td><span style="color:${S.colors[c]}">●</span> <b>${c}</b></td><td>${S.counts[c].toLocaleString()}</td><td>${(S.counts[c]/t*100).toFixed(2)}%</td></tr>`).join('')}</table></div>
  <div class="card"><h3>Vote Distribution</h3><br>
  ${ranked.map(c=>`<div class="barrow"><b>${c}</b><div class="track"><div class="fill2" style="width:${S.counts[c]/max*100}%;background:${S.colors[c]}"></div></div><span>${S.counts[c].toLocaleString()}</span></div>`).join('')}
  <p class="sub">--- Election Concluded ---</p></div>`;
}
document.getElementById('add').onclick=()=>{
  const v=document.getElementById('newName').value.trim().toUpperCase(),m=document.getElementById('nmsg');
  if(S.phase!=='nominate'){m.innerHTML='<div class="msg err">Nominations are closed.</div>';return;}
  if(!v){m.innerHTML='<div class="msg err">Enter a name.</div>';return;}
  if(S.colors[v]){m.innerHTML='<div class="msg err">Already nominated.</div>';return;}
  S.colors[v]='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');S.counts[v]=0;save();ui();
  m.innerHTML=`<div class="msg ok2">✅ <b>${v}</b> nominated!</div>`;document.getElementById('newName').value='';
};
document.getElementById('openVote').onclick=()=>{
  if(names().length<2){alert('Nominate at least 2 candidates first.');return;}
  S.phase='voting';save();ui();
};
document.getElementById('cast').onclick=()=>{
  const id=document.getElementById('vid').value.trim(),c=document.getElementById('voteFor').value,m=document.getElementById('vmsg');
  if(S.phase!=='voting'){m.innerHTML='<div class="msg err">Voting is not open.</div>';return;}
  if(!id){m.innerHTML='<div class="msg err">Enter a Voter ID.</div>';return;}
  if(S.voted.includes(id)){m.innerHTML=`<div class="msg err">⛔ ${id} already voted.</div>`;return;}
  S.voted.push(id);S.counts[c]++;save();
  m.innerHTML=`<div class="msg ok2">✅ Vote recorded. Thank you!</div>`;
  document.getElementById('vid').value='';
};
document.getElementById('endBtn').onclick=()=>{
  if(!confirm(`End election and declare results?`))return;
  S.phase='ended';save();ui();
};
document.getElementById('reset').onclick=()=>{
  if(!confirm('Start a new election? Clears all votes/candidates.'))return;
  S={phase:'nominate',colors:{},counts:{},voted:[]};save();ui();
};
ui();
</script>
</body>
</html>
